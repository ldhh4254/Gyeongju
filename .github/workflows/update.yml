name: Auto Update Gyeongju Places

# 언제 실행할지 지정합니다.
on:
  schedule:
    # 매주 일요일 오전 9시(한국 시간 기준)에 실행합니다.
    # UTC 기준으로는 00:00입니다 (0 0 * * 0)
    - cron: '0 0 * * 0'
  # 깃허브 홈페이지에서 원할 때 직접 'Run workflow' 버튼을 눌러 실행할 수도 있게 만듭니다.
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    # 1. 깃허브 저장소의 코드를 가져옵니다.
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. 파이썬 환경을 설치합니다.
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. 필요한 라이브러리(requests)를 설치합니다.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. 파이썬 스크립트를 실행하여 공공데이터를 가져옵니다.
    # 이때 깃허브에 저장해 둔 비밀 값(인증키 DATA_GO_KR_KEY)을 환경변수로 넘겨줍니다.
    - name: Fetch data from Public Data Portal
      env:
        DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      run: python fetch_data.py

    # 5. 변경된 데이터 파일(gyeongju_places.md)을 깃허브 저장소에 다시 올립니다.
    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add gyeongju_places.md
        # 변경 사항이 있을 때만 커밋합니다. (없으면 건너뜀)
        git diff --quiet && git diff --staged --quiet || git commit -m "update: 경주 맛집 데이터 자동 업데이트"
        git push

