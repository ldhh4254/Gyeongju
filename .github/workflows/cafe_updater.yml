name: Gyeongju Cafe Data Auto Updater

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

# 로봇에게 저장소 쓰기 권한을 강제로 부여합니다.
permissions: write-all

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: Run data collection script
      env:
        DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      run: python update_cafe.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add gyeongju_cafe_complete.csv
        
        if [ -n "$(git status --porcelain)" ]; then
          git commit -m "🔄 자동 업데이트: 경주 카페 데이터 변경 반영"
          git push
        else
          echo "변경 사항이 없어 커밋을 건너뜁니다."
        fi
