name: Gyeongju Cafe Data Auto Updater

on:
  schedule:
    # 매일 한국 시간(KST) 오전 6시 정각에 자동 실행 (UTC 기준 21:00)
    - cron: '0 21 * * *'
  workflow_dispatch: # 필요할 때 깃허브 웹에서 수동으로도 실행 가능하게 설정

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    # 1. 깃허브 저장소의 코드를 체크아웃
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 파이썬 환경 설정 (3.10 버전)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 필요한 라이브러리 설치 (requests, pandas)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    # 4. 파이썬 수집 스크립트 실행 (환경변수로 API Key 전달)
    - name: Run data collection script
      env:
        DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      run: python update_cafe.py

    # 5. 변경된 CSV 파일이 있으면 깃허브 저장소에 자동으로 커밋 및 푸시
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add gyeongju_cafe_complete.csv
        # 변경사항이 있을 때만 커밋 수행 (에러 방지)
        git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 자동 업데이트: 경주 카페 데이터 변경 반영" && git push)
  schedule:
    # 매일 한국 시간(KST) 오전 6시 정각에 자동 실행 (UTC 기준 21:00)
    - cron: '0 21 * * *'
  workflow_dispatch: # 필요할 때 깃허브 웹에서 수동으로도 실행 가능하게 설정

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    # 1. 깃허브 저장소의 코드를 체크아웃
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 파이썬 환경 설정 (3.10 버전)
    - name: Set up Python
      uses: actions/setup-python@v5
