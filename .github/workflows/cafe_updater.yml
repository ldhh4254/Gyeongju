name: Gyeongju Cafe Data Auto Updater

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions: write-all

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    # 토큰 권한을 체크아웃 단계부터 확실하게 매핑합니다.
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: Run data collection script
      env:
        DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      run: python update_cafe.py

    # 주소창에 토큰을 직접 심어서 인증 에러(128)를 완벽하게 차단합니다.
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add gyeongju_cafe_complete.csv
        
        if [ -n "$(git status --porcelain)" ]; then
          git commit -m "🔄 자동 업데이트: 경주 카페 데이터 변경 반영"
          # 저장소 URL에 GITHUB_TOKEN을 인증 값으로 붙여 강제 푸시합니다.
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
        else
          echo "변경 사항이 없어 커밋을 건너뜁니다."
        fi
