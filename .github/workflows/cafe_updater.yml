name: Gyeongju Cafe Data Auto Updater

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: Run data collection script
      env:
        DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      run: python update_cafe.py

    # 문법 에러가 나지 않도록 실행 명령어를 더 명확하고 안전하게 분리했습니다.
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add gyeongju_cafe_complete.csv
        
        # 변경 사항이 있을 때만 커밋하고 푸시하도록 안전하게 처리
        if [ -n "$(git status --porcelain)" ]; then
          git commit -m "🔄 자동 업데이트: 경주 카페 데이터 변경 반영"
          git push
        else
          echo "변경 사항이 없어 커밋을 건너뜁니다."
        fi